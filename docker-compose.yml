services:

  backend:
    image: adeeashok/driftlens-backend:latest
    container_name: driftlens-backend
    ports:
      - "8000:8000"
    volumes:
      - ./samples:/app/samples:ro
    environment:
      - ALLOWED_ORIGINS=*
      - PYTHONUNBUFFERED=1
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - driftlens-network

  frontend:
    image: adeeashok/driftlens-frontend:latest
    container_name: driftlens-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
    security_opt:
      - apparmor:unconfined
      - seccomp:unconfined
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - driftlens-network

networks:
  driftlens-network:
    driver: bridge
