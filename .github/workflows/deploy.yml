name: 🚀 Deploy to Minikube + Sync DriftLens

on:
  push:
    branches:
      - main
    paths:
      - 'k8s/**'

jobs:
  deploy:
    name: Deploy and Sync
    runs-on: self-hosted

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Deploy to Development
        run: |
          kubectl apply -k k8s/sample-app/overlays/dev/
          echo "✅ Dev deployed"

      - name: 📦 Deploy to Staging
        run: |
          kubectl apply -k k8s/sample-app/overlays/staging/
          echo "✅ Staging deployed"

      - name: 📦 Deploy to Production
        run: |
          kubectl apply -k k8s/sample-app/overlays/prod/
          echo "✅ Prod deployed"

      - name: ⏳ Wait for rollouts
        run: |
          kubectl rollout status deployment/sample-app \
            -n development --timeout=120s
          kubectl rollout status deployment/sample-app \
            -n staging --timeout=120s
          kubectl rollout status deployment/sample-app \
            -n production --timeout=120s

      - name: 📊 Show replica counts
        run: |
          echo "=== Current State ==="
          echo "dev:     $(kubectl get deployment sample-app -n development -o jsonpath='{.spec.replicas}')"
          echo "staging: $(kubectl get deployment sample-app -n staging -o jsonpath='{.spec.replicas}')"
          echo "prod:    $(kubectl get deployment sample-app -n production -o jsonpath='{.spec.replicas}')"

      - name: 🔄 Sync DriftLens
        run: |
          cd $GITHUB_WORKSPACE
          ./scripts/sync-from-minikube.sh

      - name: ✅ Summary
        run: |
          echo "## 🎉 Deployment Complete!" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Replicas | Image |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| dev | $(kubectl get deployment sample-app -n development -o jsonpath='{.spec.replicas}') | $(kubectl get deployment sample-app -n development -o jsonpath='{.spec.template.spec.containers[0].image}') |" >> $GITHUB_STEP_SUMMARY
          echo "| staging | $(kubectl get deployment sample-app -n staging -o jsonpath='{.spec.replicas}') | $(kubectl get deployment sample-app -n staging -o jsonpath='{.spec.template.spec.containers[0].image}') |" >> $GITHUB_STEP_SUMMARY
          echo "| prod | $(kubectl get deployment sample-app -n production -o jsonpath='{.spec.replicas}') | $(kubectl get deployment sample-app -n production -o jsonpath='{.spec.template.spec.containers[0].image}') |" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 Dashboard: http://192.168.29.55:3000" >> $GITHUB_STEP_SUMMARY
          