apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftlens
  labels:
    app: driftlens
spec:
  replicas: 1
  selector:
    matchLabels:
      app: driftlens
  template:
    metadata:
      labels:
        app: driftlens
    spec:
      containers:
        - name: backend
          image: driftlens-control-center-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: ALLOWED_ORIGINS
              value: "*"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
        - name: frontend
          image: driftlens-control-center-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOSTNAME
              value: "0.0.0.0"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
