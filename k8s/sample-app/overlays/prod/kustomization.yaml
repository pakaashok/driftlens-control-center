apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - ../../base

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: sample-app

configMapGenerator:
  - name: sample-app-config
    behavior: merge
    literals:
      - APP_ENV=production
      - LOG_LEVEL=warn
      - CACHE_ENABLED=true
      - MAX_CONNECTIONS=200
      - TIMEOUT=120
      - VERSION=1.0.5
      - DB_HOST=prod-db.internal
      - CACHE_TTL=3600
      - MONITORING_ENABLED=true
      - ALERT_EMAIL=ops@company.com

commonLabels:
  environment: prod
  tier: critical
