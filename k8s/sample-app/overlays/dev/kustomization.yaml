apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: development

resources:
  - ../../base

patches:
  - path: patch.yaml
    target:
      kind: Deployment
      name: sample-app

configMapGenerator:
  - name: sample-app-config
    behavior: merge
    literals:
      - APP_ENV=development
      - LOG_LEVEL=debug
      - CACHE_ENABLED=false
      - MAX_CONNECTIONS=10
      - TIMEOUT=30
      - VERSION=1.0.0
      - DB_HOST=dev-db.internal

commonLabels:
  environment: dev
