apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftlens
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: backend
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ALLOWED_ORIGINS
              value: "*"
            - name: LOG_LEVEL
              value: "info"
            - name: ENV_NAME
              value: "staging"
            - name: CACHE_TTL
              value: "300"
